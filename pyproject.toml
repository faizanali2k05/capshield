[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capshield"
version = "0.1.0"
description = "Path-aware redaction for Python mappings, sequences, and telemetry payloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["redaction", "privacy", "secrets", "logging", "telemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/faizanali2k05/capshield"
Repository = "https://github.com/faizanali2k05/capshield"
Issues = "https://github.com/faizanali2k05/capshield/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/capshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
